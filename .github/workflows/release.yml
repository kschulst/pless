name: Release

# Releases are cut from tags, not from every push to main. CI already builds
# and tests each push; publishing is a deliberate act.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Never publish something that does not pass its own checks.
      - name: Lint and test
        run: |
          uv sync --all-extras --dev
          uv run ruff check .
          uv run ruff format --check .
          uv run pytest -q

      - name: Build
        run: uv build

      - name: Verify the wheel installs and runs from a clean directory
        run: |
          python -m venv /tmp/verify
          /tmp/verify/bin/pip install --quiet dist/*.whl
          mkdir -p /tmp/scratch && cd /tmp/scratch
          /tmp/verify/bin/pless init
          test -f pless.toml && test -f .env
          /tmp/verify/bin/pless version

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pless
    permissions:
      # Trusted Publishing: PyPI verifies this workflow's identity through
      # OIDC, so no API token has to exist anywhere.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
