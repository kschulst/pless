[project]
name = "pless"
# The git tag is the version — see [tool.hatch.version]. Nothing here to keep
# in sync, and nothing that can disagree with what was tagged.
dynamic = ["version"]
description = "Self-hosted Paperless-ngx on hardware you own — encrypted at rest, invisible on your LAN"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kenneth Leine Schulstad", email = "ks@rubberduck.no" }]
keywords = ["paperless-ngx", "self-hosted", "raspberry-pi", "luks", "tailscale", "documents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: System Administrators",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Archiving",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "hcloud>=2.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://kschulst.github.io/pless/"
Documentation = "https://kschulst.github.io/pless/"
Source = "https://github.com/kschulst/pless"
Issues = "https://github.com/kschulst/pless/issues"
Changelog = "https://github.com/kschulst/pless/releases"

[project.scripts]
pless = "pless.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "zensical>=0.0.53",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
# Written at build time so an installed package knows its version without
# needing git present.
version-file = "src/pless/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pless"]

[tool.hatch.build.targets.sdist]
include = ["src/pless", "tests", "README.md", "LICENSE", "pless.toml", ".env.example"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# typer uses function calls as parameter defaults by design
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.pytest.ini_options]
testpaths = ["tests"]
