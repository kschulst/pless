[project]
site_url = "https://kschulst.github.io/pless/"
site_name = "pless"
site_description = "Self-hosted Paperless-ngx on hardware you own — encrypted at rest, invisible on your LAN."
site_author = "Kenneth Leine Schulstad"

copyright = "Copyright &copy; 2026 Kenneth Leine Schulstad"

repo_url = "https://github.com/kschulst/pless"
repo_name = "kschulst/pless"
edit_uri = "edit/main/docs/"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = [
    "getting-started/index.md",
    "getting-started/hardware.md" ] },
  { "Installation" = [
    "installation/index.md",
    "installation/raspberry-pi.md",
    "installation/local-vm.md",
    "installation/hetzner.md" ] },
  { "Maintenance" = "maintenance.md" },
  { "Cookbook" = [
    "cookbook/index.md",
    "cookbook/power-loss.md",
    "cookbook/verify-security.md",
    "cookbook/storage.md",
    "cookbook/switch-target.md" ] },
  { "Reference" = [
    "reference/commands.md",
    "reference/configuration.md",
    "reference/secrets.md" ] } ]

[project.theme]
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow" ]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "teal"
accent = "teal"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/kschulst/pless"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
pymdownx.highlight = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences = { custom_fences = [ { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" } ] }
pymdownx.tabbed = { alternate_style = true, combine_header_slug = true }
pymdownx.tasklist = { custom_checkbox = true }
pymdownx.tilde = {}
